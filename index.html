<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My digital Bookshelf</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Your digital Bookshelf</h1>
        <p>A little place for all your stories.</p>
    </header>


    <main>

        <!-- Top buttons -->

        <div class="top-buttons">

            <button id="addBookButton">
                + Add a book
            </button>

            <button id="goReadButton">
                Go read
            </button>

        </div>


        <!-- Bookshelf -->

        <section class="bookshelf">

            <div class="shelf" id="shelf1"></div>

            <div class="shelf" id="shelf2"></div>

            <div class="shelf" id="shelf3"></div>

        </section>


        <!-- Add book modal -->

        <div class="modal" id="bookModal">

            <div class="modal-content">

                <button class="close-button" id="closeModal">
                    x
                </button>

                <h2>Add a book</h2>

                <div class="add-book-layout">


                    <!-- Manual book form -->

                    <div class="manual-book">

                        <h3>Add manually</h3>

                        <form id="bookForm">

                            <label for="bookTitle">
                                Title
                            </label>

                            <input
                                type="text"
                                id="bookTitle"
                                required
                            >


                            <label for="bookAuthor">
                                Author
                            </label>

                            <input
                                type="text"
                                id="bookAuthor"
                                required
                            >


                            <label for="bookPages">
                                Number of pages
                            </label>

                            <input
                                type="number"
                                id="bookPages"
                                min="1"
                                required
                            >


                            <label for="bookGenre">
                                Genre
                            </label>

                            <select id="bookGenre" required>

                                <option
                                    value=""
                                    disabled
                                    selected
                                >
                                    Select a genre
                                </option>

                                <option value="Fantasy">
                                    Fantasy
                                </option>

                                <option value="Romance">
                                    Romance
                                </option>

                                <option value="Science Fiction">
                                    Science Fiction
                                </option>

                                <option value="Mystery">
                                    Mystery
                                </option>

                                <option value="Thriller">
                                    Thriller
                                </option>

                                <option value="Horror">
                                    Horror
                                </option>

                                <option value="Crime">
                                    Crime
                                </option>

                                <option value="Dark Romance">
                                    Dark Romance
                                </option>

                                <option value="Historical Fiction">
                                    Historical Fiction
                                </option>

                                <option value="Young Adult">
                                    Young Adult
                                </option>

                            </select>


                            <button type="submit">
                                Add Book
                            </button>

                        </form>

                    </div>


                    <!-- Open Library search -->

                    <div class="api-book-search">

                        <h3>Search for a book</h3>

                        <div class="search-row">

                            <input
                                type="text"
                                id="bookSearch"
                                placeholder="Enter a book title"
                            >

                            <button
                                type="button"
                                id="searchButton"
                            >
                                Search
                            </button>

                        </div>


                        <div id="searchResults"></div>

                    </div>

                </div>

            </div>

        </div>


        <!-- Book details modal -->

        <div class="modal" id="detailsModal">

            <div class="modal-content">

                <button
                    class="close-button"
                    id="closeDetails"
                >
                    x
                </button>

                <h2 id="detailsTitle"></h2>

                <div class="book-meta">

                    <p id="detailsAuthor"></p>

                    <p id="detailsGenre"></p>

                </div>


                <div class="progress-section">

                    <div class="progress-info">

                        <span>
                            Reading progress
                        </span>

                        <span id="progressText"></span>

                    </div>


                    <div class="progress-bar">

                        <div
                            class="progress-fill"
                            id="progressFill"
                        ></div>

                    </div>

                </div>


                <label for="currentPage">
                    Current page
                </label>

                <input
                    type="number"
                    id="currentPage"
                    min="0"
                >


                <button id="updateProgress">
                    Update progress
                </button>

                <button id="deleteBookButton"> 
                    Delete Book 
                </button>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
